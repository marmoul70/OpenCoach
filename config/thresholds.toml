# =========================================================
# OpenCoach - Seuils configurables
# =========================================================
#
# Ce fichier centralise les seuils métier utilisés par
# OpenCoach.
#
# Les valeurs peuvent être modifiées sans modifier le code
# Python.
# =========================================================


# ---------------------------------------------------------
# Activity matching
# ---------------------------------------------------------

[activity_matching]

# Score minimum permettant de considérer une activité
# comme une bonne correspondance avec une séance planifiée.
best_match_score = 75.0


# ---------------------------------------------------------
# Daily Readiness - Baseline
# ---------------------------------------------------------

[readiness.baseline]

# Nombre de jours utilisés pour construire la baseline.
window_days = 14

# Nombre minimum de mesures nécessaires pour considérer
# une baseline comme suffisamment fiable.
minimum_samples = 7


# ---------------------------------------------------------
# Daily Readiness - Classification du score
# ---------------------------------------------------------

[readiness.score]

high_min = 85.0
good_min = 70.0
moderate_min = 50.0
low_min = 30.0

# Une alerte critique empêche le score final
# de dépasser cette valeur.
single_critical_cap = 60.0

# Deux alertes critiques ou plus limitent fortement
# le score de disponibilité.
multiple_critical_cap = 29.0


# ---------------------------------------------------------
# Daily Readiness - Pénalités
# ---------------------------------------------------------

[readiness.penalties]

warning = 10.0
critical = 25.0


# ---------------------------------------------------------
# Daily Readiness - HRV
# ---------------------------------------------------------

[readiness.hrv]

# Écart en pourcentage par rapport à la baseline.
# Une baisse est défavorable.
warning_percent = -10.0
critical_percent = -20.0


# ---------------------------------------------------------
# Daily Readiness - Fréquence cardiaque de repos
# ---------------------------------------------------------

[readiness.resting_hr]

# Écart en pourcentage par rapport à la baseline.
# Une hausse est défavorable.
warning_percent = 7.0
critical_percent = 12.0


# ---------------------------------------------------------
# Daily Readiness - Durée du sommeil
# ---------------------------------------------------------

[readiness.sleep_duration]

# Écart relatif à la baseline.
warning_percent = -15.0
critical_percent = -30.0

# Garde-fous absolus exprimés en heures.
warning_hours = 6.0
critical_hours = 4.5


# ---------------------------------------------------------
# Daily Readiness - Score de sommeil
# ---------------------------------------------------------

[readiness.sleep_score]

warning_value = 65.0
critical_value = 50.0


# ---------------------------------------------------------
# Daily Readiness - Charge d'entraînement
# ---------------------------------------------------------

[readiness.training_load]

# Balance = CTL - ATL.
#
# Une valeur fortement négative signifie que la fatigue
# aiguë est élevée par rapport à la forme chronique.
warning_balance = -10.0
critical_balance = -20.0

# ---------------------------------------------------------
# Daily Readiness - Contexte subjectif
# ---------------------------------------------------------

[readiness.context.fatigue]

# Échelle 1 à 5.
warning_min = 4
critical_min = 5


[readiness.context.pain]

# Échelle 0 à 10.
warning_min = 4
critical_min = 7


[readiness.context.illness]

mild_level = "warning"
significant_level = "critical"


[readiness.context.treatment]

mild_level = "warning"
significant_level = "critical"


[readiness.context.caps]

significant_treatment = 50.0
significant_illness = 29.0
critical_pain = 40.0

[readiness.context.motivation]

low_max = 1

# ---------------------------------------------------------
# Coach Decision Engine
# ---------------------------------------------------------

[coach_decision.readiness]

# Score à partir duquel la séance planifiée peut être
# conservée sans adaptation liée à la récupération.
keep_min = 70.0

# En dessous de keep_min, une réduction peut être appliquée.
reduce_min = 50.0

# En dessous de reduce_min, une séance alternative de
# récupération doit être privilégiée.
replace_min = 30.0

# En dessous de replace_min, le repos est privilégié.
# La valeur correspond implicitement à 0 <= score < 30.


[coach_decision.reduction]

# Facteurs appliqués lorsqu'une séance doit être réduite.
duration_factor = 0.70
intensity_factor = 0.80


[coach_decision.constraints]

# Réduction supplémentaire de durée lorsqu'une contrainte
# impose d'éviter l'intensité élevée.
avoid_high_intensity_duration_factor = 0.85

# Durée maximale proposée pour une séance de récupération.
recovery_max_duration_minutes = 45