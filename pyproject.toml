[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "opencoach"
version = "0.1.0"
description = "OpenCoach - Personal trail running coach"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141,<1",
    "uvicorn[standard]>=0.52,<1",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.16,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "httpx>=0.28,<1",
]

[tool.setuptools.packages.find]
where = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["app"]